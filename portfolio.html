<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Bartosz Kaczmarek Fotografia</title>
  <meta name="description" content="Zdjęcia z osiemnastek, urodzin, komunii i imprez rodzinnych, portrety i plenery. Zobacz portfolio Bartosza Kaczmarka.">
  <meta property="og:title" content="Portfolio — Bartosz Kaczmarek Fotografia">
  <meta property="og:description" content="Reportaże z imprez, portrety i plenery.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pl_PL">
  <meta name="theme-color" content="#3d372c">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="portfolio" class="nav-solid">

  <div id="header-placeholder"></div>

  <main id="main">

    <div class="page-hero">
      <div class="container">
        <span class="label">Portfolio</span>
        <h1>Kadry z imprez i sesji</h1>
        <p>Wybierz kategorię i kliknij zdjęcie, żeby zobaczyć je w pełnym rozmiarze.</p>
        <nav class="breadcrumb" aria-label="Okruszki">
          <a href="index.html">Strona główna</a>
          <span aria-hidden="true">›</span>
          <span>Portfolio</span>
        </nav>
      </div>
    </div>

    <section>
      <div class="container">

        <div class="gallery-filters" role="group" aria-label="Filtruj zdjęcia">
          <button type="button" data-filter="all" aria-pressed="true">Wszystkie</button>
          <button type="button" data-filter="wydarzenia" aria-pressed="false">Imprezy i wydarzenia</button>
          <button type="button" data-filter="portrety" aria-pressed="false">Portrety i sesje</button>
          <button type="button" data-filter="plener" aria-pressed="false">Plener</button>
          <button type="button" data-filter="z-gory" aria-pressed="false">Z lotu ptaka</button>
        </div>

        <!--
          Nowe zdjęcie: wrzuć do assets/img/portfolio/ wersję pełną (maks. 1600 px) i -sm (maks. 720 px, .webp),
          skopiuj jeden <figure> i ustaw data-category (kilka kategorii oddziel spacją).
        -->
        <div class="gallery">
          <figure class="gallery-item" data-category="wydarzenia">
            <button type="button" data-full="assets/img/portfolio/osiemnastka-dekoracje.webp">
              <img src="assets/img/portfolio/osiemnastka-dekoracje-sm.webp" alt="Dekoracja balonowa i podświetlany napis 18 na osiemnastce" width="720" height="480" loading="lazy">
            </button>
            <figcaption><span>Osiemnastka</span>Dekoracje przed przyjęciem</figcaption>
          </figure>

          <figure class="gallery-item" data-category="portrety plener">
            <button type="button" data-full="assets/img/portfolio/portret-wachlarz.webp">
              <img src="assets/img/portfolio/portret-wachlarz-sm.webp" alt="Portret dziewczyny z wachlarzem w plenerze" width="720" height="481" loading="lazy">
            </button>
            <figcaption><span>Sesja portretowa</span>Plener z wachlarzem</figcaption>
          </figure>

          <figure class="gallery-item" data-category="portrety plener">
            <button type="button" data-full="assets/img/portfolio/julka-serce.webp">
              <img src="assets/img/portfolio/julka-serce-sm.webp" alt="Czarno-białe zdjęcie dziewczyny siedzącej tyłem i składającej dłonie w serce" width="481" height="720" loading="lazy">
            </button>
            <figcaption><span>Sesja portretowa</span>Serce z dłoni</figcaption>
          </figure>

          <figure class="gallery-item" data-category="portrety plener">
            <button type="button" data-full="assets/img/portfolio/julka-las.webp">
              <img src="assets/img/portfolio/julka-las-sm.webp" alt="Dziewczyna z aparatem fotograficznym na leśnej drodze w popołudniowym słońcu" width="720" height="481" loading="lazy">
            </button>
            <figcaption><span>Sesja portretowa</span>Leśna ścieżka</figcaption>
          </figure>

          <figure class="gallery-item" data-category="portrety">
            <button type="button" data-full="assets/img/portfolio/ognisko-gitara.webp">
              <img src="assets/img/portfolio/ognisko-gitara-sm.webp" alt="Dziewczyna gra na gitarze przy ognisku wieczorem" width="481" height="720" loading="lazy">
            </button>
            <figcaption><span>Portret</span>Wieczór przy ognisku</figcaption>
          </figure>

          <figure class="gallery-item" data-category="portrety">
            <button type="button" data-full="assets/img/portfolio/komunia-portret.webp">
              <img src="assets/img/portfolio/komunia-portret-sm.webp" alt="Dziewczynka w stroju komunijnym na tle bluszczu" width="480" height="720" loading="lazy">
            </button>
            <figcaption><span>Komunia</span>Portret w plenerze</figcaption>
          </figure>

          <figure class="gallery-item" data-category="wydarzenia">
            <button type="button" data-full="assets/img/portfolio/tort-fontanny.webp">
              <img src="assets/img/portfolio/tort-fontanny-sm.webp" alt="Wniesienie tortu z zimnymi ogniami podczas przyjęcia" width="720" height="480" loading="lazy">
            </button>
            <figcaption><span>Przyjęcie</span>Tort i zimne ognie</figcaption>
          </figure>

          <figure class="gallery-item" data-category="wydarzenia z-gory">
            <button type="button" data-full="assets/img/portfolio/czterdziestka-z-gory.webp">
              <img src="assets/img/portfolio/czterdziestka-z-gory-sm.webp" alt="Goście ułożeni w liczbę 40, zdjęcie z góry" width="720" height="576" loading="lazy">
            </button>
            <figcaption><span>Czterdziestka</span>Goście w kształcie liczby 40 — ujęcie z góry</figcaption>
          </figure>

          <figure class="gallery-item" data-category="portrety">
            <button type="button" data-full="assets/img/portfolio/mama-z-synem.webp">
              <img src="assets/img/portfolio/mama-z-synem-sm.webp" alt="Mama z synem w eleganckich strojach pozują przed budynkiem" width="481" height="720" loading="lazy">
            </button>
            <figcaption><span>Portret rodzinny</span>Mama z synem</figcaption>
          </figure>

          <figure class="gallery-item" data-category="wydarzenia">
            <button type="button" data-full="assets/img/portfolio/impreza-tematyczna.webp">
              <img src="assets/img/portfolio/impreza-tematyczna-sm.webp" alt="Goście w kapeluszach pozują na imprezie tematycznej" width="720" height="480" loading="lazy">
            </button>
            <figcaption><span>Impreza tematyczna</span>Zdjęcie grupowe gości</figcaption>
          </figure>

          <figure class="gallery-item" data-category="plener">
            <button type="button" data-full="assets/img/portfolio/plener-zachod-slonca.webp">
              <img src="assets/img/portfolio/plener-zachod-slonca-sm.webp" alt="Sylwetka z uniesionymi rękami na plaży o zachodzie słońca" width="480" height="720" loading="lazy">
            </button>
            <figcaption><span>Plener</span>Zachód słońca nad morzem</figcaption>
          </figure>

          <figure class="gallery-item" data-category="wydarzenia portrety">
            <button type="button" data-full="assets/img/portfolio/trzydziestka-portret.webp">
              <img src="assets/img/portfolio/trzydziestka-portret-sm.webp" alt="Solenizantka pozuje przy dekoracji z napisem 30" width="720" height="480" loading="lazy">
            </button>
            <figcaption><span>Trzydziestka</span>Portret solenizantki</figcaption>
          </figure>

          <figure class="gallery-item" data-category="wydarzenia">
            <button type="button" data-full="assets/img/portfolio/zdjecie-grupowe.webp">
              <img src="assets/img/portfolio/zdjecie-grupowe-sm.webp" alt="Zdjęcie grupowe gości przed budynkiem z kolorowym dymem" width="720" height="576" loading="lazy">
            </button>
            <figcaption><span>Uroczystość rodzinna</span>Zdjęcie grupowe</figcaption>
          </figure>

          <figure class="gallery-item" data-category="plener">
            <button type="button" data-full="assets/img/portfolio/fotograf-w-plenerze.webp">
              <img src="assets/img/portfolio/fotograf-w-plenerze-sm.webp" alt="Fotograf z aparatem leży w trawie podczas zdjęć" width="480" height="720" loading="lazy">
            </button>
            <figcaption><span>Za kulisami</span>W plenerze</figcaption>
          </figure>
        </div>

      </div>
    </section>

    <section id="cta">
      <div class="container">
        <h2 class="reveal">Podoba Ci się ten styl?</h2>
        <p class="reveal">Sprawdź wolne terminy i zarezerwuj fotografa na swoje wydarzenie.</p>
        <div class="cta-actions reveal">
          <a href="kontakt.html#terminy" class="btn btn-primary">Wolne terminy</a>
          <a href="oferta.html" class="btn btn-outline">Oferta i cennik</a>
        </div>
      </div>
    </section>

  </main>

  <!-- Lightbox -->
  <dialog class="lightbox" id="lightbox" aria-label="Podgląd zdjęcia">
    <span class="lightbox-counter"></span>
    <button type="button" class="lightbox-btn lightbox-close" aria-label="Zamknij podgląd">×</button>
    <button type="button" class="lightbox-btn lightbox-prev" aria-label="Poprzednie zdjęcie">‹</button>
    <figure>
      <img alt="">
      <figcaption></figcaption>
    </figure>
    <button type="button" class="lightbox-btn lightbox-next" aria-label="Następne zdjęcie">›</button>
  </dialog>

  <div id="footer-placeholder"></div>

  <script src="assets/js/components.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/booking.js"></script>
</body>
</html>
